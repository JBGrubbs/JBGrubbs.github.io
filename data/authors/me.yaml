bio: |
  Joshua Grubbs is an Associate Professor of Psychology at the University of New Mexico and an
  Investigator at the Center on Alcohol, Substance use, And Addictions (CASAA), where he directs
  the Behavioral Addictions And Associated Disorders (BAAAD) Lab. His research examines gambling
  and sports betting, compulsive sexual behavior, and alcohol use, with a focus on how social,
  moral, and policy contexts shape addictive behavior.

